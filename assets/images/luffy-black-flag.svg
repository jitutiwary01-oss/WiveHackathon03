<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80">
  <!-- Flag Pole with Brass Finial -->
  <rect x="3" y="0" width="4" height="80" rx="1.5" fill="#4A2810"/>
  <circle cx="5" cy="4" r="4.5" fill="#E6B422" stroke="#8C6B10" stroke-width="1.2"/>
  
  <!-- Black Pirate Flag Canvas with Wind Flutter Contour -->
  <path d="M7 6 C35 1, 65 11, 88 5 C102 1, 116 6, 116 6 L113 56 C95 51, 68 61, 44 54 C24 49, 7 56, 7 56 Z" fill="#0C0F14" stroke="#1F2937" stroke-width="1.5"/>
  
  <!-- Fabric Shadow Ripples -->
  <path d="M42 8 C58 13, 76 9, 90 6 L88 54 C72 57, 56 53, 40 51 Z" fill="#151A22" opacity="0.5"/>
  <path d="M12 7 C24 9, 34 11, 42 8 L40 51 C32 54, 22 52, 12 55 Z" fill="#07090C" opacity="0.6"/>

  <!-- Crossed Bones (White) -->
  <line x1="38" y1="21" x2="84" y2="43" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="84" y1="21" x2="38" y2="43" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- Bone Knobs -->
  <circle cx="37" cy="20" r="3.2" fill="#FFFFFF"/>
  <circle cx="85" cy="20" r="3.2" fill="#FFFFFF"/>
  <circle cx="37" cy="44" r="3.2" fill="#FFFFFF"/>
  <circle cx="85" cy="44" r="3.2" fill="#FFFFFF"/>

  <!-- Pirate Skull Base (White) -->
  <ellipse cx="61" cy="30" rx="14" ry="11.5" fill="#FFFFFF"/>
  <rect x="55" y="37" width="12" height="7.5" rx="2.5" fill="#FFFFFF"/>

  <!-- Eye Sockets & Nose (Black) -->
  <circle cx="56" cy="31" r="3.4" fill="#0C0F14"/>
  <circle cx="66" cy="31" r="3.4" fill="#0C0F14"/>
  <polygon points="61,34 59.5,37 62.5,37" fill="#0C0F14"/>

  <!-- Grinning Pirate Teeth -->
  <line x1="56" y1="41" x2="66" y2="41" stroke="#0C0F14" stroke-width="1.2"/>
  <line x1="58" y1="39" x2="58" y2="43" stroke="#0C0F14" stroke-width="1"/>
  <line x1="61" y1="39" x2="61" y2="43" stroke="#0C0F14" stroke-width="1"/>
  <line x1="64" y1="39" x2="64" y2="43" stroke="#0C0F14" stroke-width="1"/>

  <!-- Luffy's Straw Hat (Yellow Dome + Wide Brim + Red Band) -->
  <!-- Wide Brim -->
  <ellipse cx="61" cy="23" rx="21" ry="5.8" fill="#E6B422" stroke="#8C6B10" stroke-width="1.2"/>
  <!-- Hat Crown -->
  <path d="M47 22 C47 11, 53 7, 61 7 C69 7, 75 11, 75 22 Z" fill="#E6B422" stroke="#8C6B10" stroke-width="1.2"/>
  <!-- Red Ribbon Band -->
  <path d="M47 20 C52 22, 70 22, 75 20 L75 23 C70 25, 52 25, 47 23 Z" fill="#D9251D"/>
</svg>
